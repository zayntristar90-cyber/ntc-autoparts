function cart(){if(!S.cart.length)return `<div class="empty">Your cart is empty.<br>Search a part and tap Add to Cart.</div>`;
const sub=total(),dis=DISC_ON?Math.round(sub*DISC_PCT/100):0;
return `<h2 class="inv">Checkout Invoice</h2><div class="cg"><div>${S.cart.map(c=>{const p=byNo(c.no);return `<div class="row ci"><div class="pn" style="font-size:18px">${esc(p.no)}</div><div class="cl"><span>${p.cat}</span><span class="pr">${p.pr.toLocaleString()} * ${c.n}</span><button class="rm" aria-label="Remove ${esc(p.no)} from cart" onclick="S.cart=S.cart.filter(x=>x.no!=='${p.no}');draw()">🗑 Remove</button></div><div class="cl2"><span class="br">Quantity : <button class="qb" aria-label="Less" onclick="chg('${p.no}',-1)">−</button> ${c.n} <button class="qb" aria-label="More" onclick="chg('${p.no}',1)">+</button></span><span>${pkr(p.pr*c.n)}</span></div></div>`}).join("")}</div><div class="row pay"><h3>Payment Detail</h3><div class="pl2"><span>Item total</span><span>${pkr(sub)}</span></div><div class="pl2"><span>Discount (${DISC_PCT}%)</span><span>${pkr(dis)}</span></div><div class="pl2 gt"><b>Grand Total</b><b>${pkr(sub-dis)}</b></div><button class="btn" onclick="placeOrder()">${t("ord")}</button></div></div>`}
function chg(no,d){const c=S.cart.find(x=>x.no===no);c.n+=d;if(c.n<1)S.cart=S.cart.filter(x=>x!==c);draw()}
const total=()=>S.cart.reduce((a,c)=>a+byNo(c.no).pr*c.n,0);
function placeOrder(){S.orders.unshift({id:1000+S.orders.length+1,items:[...S.cart],total:total(),date:new Date().toLocaleDateString()});S.cart=[];S.ot="on";S.stack=["home"];S.scr="orders";draw();toast("Order placed")}
function orders(){const past=S.ot==="past";return `<div class="ot"><button class="${!past?"on":""}" onclick="S.ot='on';draw()">Ongoing Orders</button><button class="${past?"on":""}" onclick="S.ot='past';draw()">Past Orders</button></div>`+
(past?`<div class="empty">No past orders yet.</div>`:S.orders.map(o=>`<div class="row"><div class="top"><b>Order #${o.id}</b><span class="pr">${pkr(o.total)}</span></div><div class="br">${o.date} · ${o.items.length} item(s)</div>${o.items.map(i=>`<div>${esc(i.no)} × ${i.n}</div>`).join("")}</div>`).join("")||`<div class="empty">${t("empty")}</div>`)}
function profile(){return `<div class="out" style="text-align:left"><div style="font-size:18px;font-weight:800">ZAYN AWAN</div><small>Total Orders : ${S.orders.length}</small></div>
<div class="row"><div class="top"><span class="br">Company</span><button class="sm">Update Company</button></div><div class="top" style="margin-top:12px"><span class="br">City</span><b>Karachi</b></div><div class="top" style="margin-top:12px"><span class="br">Phone</span><b>0331 2588269</b></div></div>`}
const contact=()=>`<div class="cr">✉ <a href="mailto:info@ntc-autoparts.com">info@ntc-autoparts.com</a></div><div class="cr">📠 <a href="tel:+922135393061">021-35393061-62</a></div><div class="cr">📞 <a href="tel:+923179996180">+92 317 9996180</a></div><div class="cr">🌐 <a href="https://ntc-autoparts.com" target="_blank" rel="noopener">ntc-autoparts.com</a></div>`;
const xy=([lo,la])=>[Math.round((lo-60)*20),Math.round((38-la)*19)];
const mapSVG=()=>`<svg class="pkmap" viewBox="0 0 360 290" role="group" aria-label="Outlet locations in Pakistan"><path d="M${BORDER.map(xy).join("L")}Z" fill="var(--tint)" stroke="var(--red)" stroke-width="2" stroke-linejoin="round"/>${OUTLETS.map((o,i)=>{const[x,y]=xy(OUT[i]);return `<g class="pin" tabindex="0" role="button" aria-label="${o[0]} outlet" onclick="pinTo(${i})" onkeydown="if(event.key==='Enter')pinTo(${i})"><circle class="pr1" cx="${x}" cy="${y}" r="8"/><circle cx="${x}" cy="${y}" r="5" fill="var(--red)" stroke="#fff" stroke-width="2"/><text x="${x+9}" y="${y+4}" font-size="11" font-weight="700" fill="var(--ink)">${o[0]}</text></g>`}).join("")}</svg>`;
function pinTo(i){const e=document.getElementById("o"+i);e.scrollIntoView({behavior:RM?"auto":"smooth",block:"center"});e.classList.add("hl");setTimeout(()=>e.classList.remove("hl"),1600)}
function about(){return `<div class="abt"><div class="row" style="border-color:var(--red)"><b style="font-size:17px">NTC Autoparts</b>${contact()}</div><div class="row">${mapSVG()}</div></div><div class="ogrid">`+OUTLETS.map(([c,i,a,h],k)=>`<div class="out" id="o${k}"><div class="oi">${i}</div><b style="display:block;margin:8px 0">${c.toUpperCase()} OUTLET</b>${a}<small style="display:block;margin-top:10px">${h}</small><a class="mapb" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("NTC Auto Parts, "+a+", Pakistan")}" target="_blank" rel="noopener">📍 Open in Maps</a></div>`).join("")+`</div>`+`<div class="row" style="border-color:var(--red);margin-top:18px"><b>Follow us on Social Media:</b><div class="soc"><a href="${SOC.wa}" target="_blank" rel="noopener" aria-label="WhatsApp" style="background:#25d366"><svg width="28" height="28" viewBox="0 0 24 24"><path fill="#fff" d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3zm4.6 12.4c-.2.6-1.1 1-1.6 1.1-.4 0-.9.2-3-.6-2.5-1.1-4.1-3.7-4.2-3.8-.1-.2-1-1.3-1-2.5s.6-1.7.9-1.9c.2-.2.4-.3.6-.3h.5c.2 0 .3 0 .5.4l.7 1.7c.1.1.1.3 0 .4l-.3.5-.4.4c-.1.1-.2.3-.1.5.1.2.7 1.1 1.5 1.8 1 .9 1.8 1.2 2 1.3.2.1.4.1.5-.1l.7-.8c.1-.2.3-.2.5-.1l1.6.8c.2.1.3.2.4.3 0 .1 0 .6-.3 1z"/></svg></a><a href="${SOC.fb}" target="_blank" rel="noopener" aria-label="Facebook" style="background:#3b5998;font-size:26px">f</a><a href="${SOC.li}" target="_blank" rel="noopener" aria-label="LinkedIn" style="background:#0a78b5">in</a></div></div><div class="dev">Developed by <b>VIION</b></div>`}
function help(){return `<div class="row" style="border-color:var(--red)"><b style="font-size:17px">NTC Autoparts</b>${contact()}</div><button class="dang" onclick="S.del=true;draw()">🗑 Delete My Account</button>`}
function delDlg(){return `<div class="scrim" style="z-index:6" onclick="S.del=false;draw()"></div><div class="dlg" role="dialog"><h3>Delete your account?</h3><p class="br" style="margin:8px 0">This sends a deletion request to NTC support and clears your orders.</p><button onclick="S.del=false;draw()">Cancel</button><button style="color:var(--red);font-weight:700" onclick="S.del=false;S.cart=[];S.orders=[];draw();toast('Deletion request sent')">Delete</button></div>`}
function drawer(){const it=[["home","home"],["profile","profile"],["orders","hist"],["about","about"],["help","help"]];
return `<div class="scrim" onclick="S.menu=false;draw()"></div><nav class="drawer" aria-label="Main menu"><span class="ver">APP V1.0.50</span><div class="me">ZAYN AWAN</div>
${it.map(([s,l])=>`<button class="mi ${S.scr===s?"on":""}" onclick="S.menu=false;S.stack=[];S.scr='${s}';draw()">${t(l)}<span>›</span></button>`).join("")}
<button class="mi" onclick="S.dlg=true;draw()">${t("lang")}<span class="br">${S.lang==="en"?"English":"اردو"}</span></button>
<button class="mi out" onclick="S.menu=false;S.cart=[];toast('Logged out')">${t("out")}<span>›</span></button></nav>`}
function dlg(){return `<div class="scrim" style="z-index:6" onclick="S.dlg=false;draw()"></div><div class="dlg" role="dialog"><h3>Change Language</h3><button onclick="setLang('en')">English</button><button onclick="setLang('ur')">اردو پاکستان</button></div>`}
function setLang(l){S.lang=l;S.dlg=false;S.menu=false;draw()}

// ---------- Slider: autoplay, swipe, arrows ----------
function slide(i){const n=BAN.length;S.banner=(i+n)%n;const t=$("#trk");if(t)t.style.transform=`translateX(-${S.banner*100}%)`;document.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on",k===S.banner))}
setInterval(()=>{if(S.scr==="home"&&!S.menu&&!S.dlg&&!S.hold&&!S.boot&&$("#trk"))slide(S.banner+1)},3500);
let sx=null;
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("#ban");sx=b?e.clientX:null;S.hold=!!b});
document.addEventListener("pointerup",e=>{if(sx!==null){const dx=e.clientX-sx;if(Math.abs(dx)>40)slide(S.banner+(dx<0?1:-1))}sx=null;S.hold=false});
document.addEventListener("pointercancel",()=>{sx=null;S.hold=false});
// ---------- Part lists: autoplay + mouse drag ----------
document.addEventListener("pointerdown",()=>{S.last=Date.now()});
let dr=null;
document.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;const h=e.target.closest&&e.target.closest(".hs");dr=h?{h,x:e.clientX,l:h.scrollLeft}:null});
document.addEventListener("pointermove",e=>{if(dr)dr.h.scrollLeft=dr.l-(e.clientX-dr.x)});
document.addEventListener("pointerup",()=>{dr=null});
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function hsStep(el){const f=el.firstElementChild;if(!f)return;const w=f.offsetWidth+10,set=(el.scrollWidth+10)/3;if(el.scrollLeft>=set)el.scrollLeft-=set;el.scrollBy({left:w,behavior:RM?"auto":"smooth"})}
setInterval(()=>{if(S.scr==="home"&&!S.menu&&!S.dlg&&!S.boot&&Date.now()-(S.last||0)>3500)document.querySelectorAll(".hs").forEach(e=>{if(!e.matches(":hover"))hsStep(e)})},2200);
// ---------- Render ----------
const T={home:["",home],models:["Select Model",models],cats:["Select Category",cats],list:["Products",list],detail:["Order",detail],cart:["Checkout Invoice",cart],orders:["Order History",orders],profile:["Profile",profile],about:["About us",about],help:["Help & Support",help]};
function draw(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
const [title,fn]=T[S.scr];const sc=$("main")?.scrollTop||0;
const bar=S.scr==="detail"?`<div class="bar"><div class="qty"><button aria-label="Less" onclick="S.qty[S.sel]=Math.max(1,(S.qty[S.sel]||1)-1);draw()">−</button><span>${S.qty[S.sel]||1}</span><button aria-label="More" onclick="S.qty[S.sel]=(S.qty[S.sel]||1)+1;draw()">+</button></div><button class="btn" onclick="add(S.sel,S.qty[S.sel]||1)">Add to Order</button></div>`:"";
$("#app").innerHTML=head(title)+`<main class="${S.scr!==lastScr?"pg":""}" dir="${S.lang==="ur"?"rtl":"ltr"}"><div class="wrap ${NARROW.includes(S.scr)?"n":""}">${fn()}</div></main>`+bar+(S.menu?drawer():"")+(S.dlg?dlg():"")+(S.del?delDlg():"")+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
const nw=S.scr!==lastScr;$("main").scrollTop=nw?0:sc;if(nw)document.querySelectorAll("main :is(.tile,.car,.row,.out,.chip)").forEach((e,i)=>e.style.animationDelay=Math.min(i,14)*35+"ms");lastScr=S.scr;if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}}
draw();openHash();
// ---------- Open sequence: splash (2.6s) -> ad (5s, skippable) -> app ----------
(()=>{const b=$("#boot"),bs=$("#bs"),ba=$("#ba"),sk=$("#skip");S.boot=true;let done=false,iv;
const end=()=>{if(done)return;done=true;clearInterval(iv);S.boot=false;b.classList.add("out");setTimeout(()=>b.remove(),600)};
setTimeout(()=>{bs.classList.add("gone");ba.hidden=false;let n=5;sk.textContent="Skip "+n;$("#pbi").style.animation="fill 5s linear forwards";
iv=setInterval(()=>{n--;if(n<=0)end();else sk.textContent="Skip "+n},1000);sk.onclick=end},2600)})();
</script>
<script>
// ---- PWA: offline cache + install prompt ----
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(()=>{let ev=null;const bar=document.createElement("div");
bar.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:#d8141f;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;font:14px sans-serif;max-width:406px;margin:auto";
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const show=(html,btn)=>{if(standalone||sessionStorage.getItem("hideInstall"))return;bar.innerHTML=`<span style="flex:1">${html}</span>${btn?'<button id="ib" style="background:#fff;color:#d8141f;border:0;border-radius:10px;padding:8px 14px;font-weight:700">Install</button>':""}<button id="ix" aria-label="Close" style="background:none;border:0;color:#fff;font-size:20px">✕</button>`;bar.style.display="flex";
bar.querySelector("#ix").onclick=()=>{bar.style.display="none";try{sessionStorage.setItem("hideInstall","1")}catch(e){}};
const b=bar.querySelector("#ib");if(b)b.onclick=async()=>{ev.prompt();await ev.userChoice;ev=null;bar.style.display="none"}};
document.body.appendChild(bar);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;show("Install NTC Auto Parts on your phone",true)});
addEventListener("appinstalled",()=>{bar.style.display="none"});
if(/iphone|ipad|ipod/i.test(navigator.userAgent))show("To install: tap Share, then Add to Home Screen",false);
})();
</script>
</body>
</html>
